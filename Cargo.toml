[package]
name = "rotex-wgpu"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A wgpu backend for rotex"
documentation = "https://docs.rs/rotex-wgpu"
repository = "https://github.com/rotex-labs/rotex-wgpu"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = "0.1.89"
raw-window-handle = "0.6"
rotex-core = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "1fe8f0abdfb8545ba4b9cfa9465d085eaf3fb799" }
rotex-types = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "1fe8f0abdfb8545ba4b9cfa9465d085eaf3fb799" }
wgpu = { version = "29.0.3", features = ["spirv"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29.0.3", features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
pollster = "0.4.0"
rotex-conformance = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "1fe8f0abdfb8545ba4b9cfa9465d085eaf3fb799" }
