[package]
name = "rotex-wgpu"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A wgpu backend for rotex"
repository = "https://github.com/rotex-labs/rotex-wgpu"

[dependencies]
async-trait = "0.1.89"
raw-window-handle = "0.6"
rotex-core = { version = "0.2.0" }
rotex-types = { version = "0.2.0" }
wgpu = { version = "29.0.3", features = ["spirv"] }

[dev-dependencies]
pollster = "0.4.0"
rotex-conformance = { version = "0.2.0" }
